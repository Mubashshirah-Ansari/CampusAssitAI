
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusAssist AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #ddd;
        }

        h1 {
            color: #2563eb;
            text-align: center;
        }

        #chat-box {
            min-height: 250px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 15px;
            margin: 20px 0;
            border-radius: 8px;
        }

        input {
            width: 75%;
            padding: 12px;
            box-sizing: border-box;
        }

        button {
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:disabled {
            background: gray;
            cursor: not-allowed;
        }

        .message {
            margin: 12px 0;
            line-height: 1.5;
        }

        .error {
            color: #dc2626;
        }

        .assistant {
            color: #166534;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>CampusAssist AI</h1>
        <p>Ask your university-related questions below.</p>

        <input
    type="password"
    id="api-key"
    placeholder="Enter your API key"
    style="width: 100%; margin-bottom: 12px;"
    >

        <div id="chat-box">
            <p>Welcome! How can I help you today?</p>
        </div>

        <input
            type="text"
            id="question"
            placeholder="Type your question..."
        >

        <button id="send-button" onclick="sendMessage()">
            Send
        </button>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById("question");
            const button = document.getElementById("send-button");
            const chatBox = document.getElementById("chat-box");

            const question = input.value.trim();
            const apiKey = document.getElementById("api-key").value.trim();

            if (!question) {
                alert("Please enter a question.");
                return;
            }

            const userMessage = document.createElement("p");
            userMessage.className = "message";
            userMessage.textContent = "You: " + question;
            chatBox.appendChild(userMessage);

            input.value = "";
            button.disabled = true;
            button.textContent = "Loading...";

            const loading = document.createElement("p");
            loading.textContent = "CampusAssist AI is thinking...";
            loading.id = "loading";
            chatBox.appendChild(loading);

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-API-Key": apiKey
                    },
                    body: JSON.stringify({
                        question: question
                    })
                });

                const data = await response.json();

                loading.remove();

                const answer = document.createElement("p");
                answer.className = "message assistant";

                if (!response.ok) {
                    answer.className = "message error";
                    answer.textContent =
                        "Error: " + (data.error?.message || "Request failed.");
                } else {
                    answer.textContent = "CampusAssist AI: " + data.answer;
                }

                chatBox.appendChild(answer);

            } catch (error) {
                loading.remove();

                const errorMessage = document.createElement("p");
                errorMessage.className = "message error";
                errorMessage.textContent =
                    "Unable to connect to the server. Please try again.";

                chatBox.appendChild(errorMessage);

            } finally {
                button.disabled = false;
                button.textContent = "Send";
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
    </script>
</body>
</html>
